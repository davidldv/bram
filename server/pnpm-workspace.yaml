# pnpm reads build-script allow-listing here. Only dependencies set to true may
# run install lifecycle scripts; everything else is blocked (supply-chain hardening).
allowBuilds:
  esbuild: true

# 7-day cooldown (in minutes) before newly published versions may resolve.
minimumReleaseAge: 10080

# Force patched versions of dev-only transitive deps flagged by `pnpm audit`.
overrides:
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6"
  "vite@<=6.4.2": ">=6.4.3"
  "esbuild@<0.28.1": ">=0.28.1"
